# Detections exported from /opt/splunk/etc/apps/search/local/savedsearches.conf
# Replace this file with your real export once the searches are saved as alerts.

[T1087.001 - Local Account Discovery Burst]
description = Three or more distinct local account enumeration behaviors on one host within 5 minutes. MITRE ATT&CK T1087.001.
search = index=atomic sourcetype=auditd type=EXECVE a0 IN (cat, head, tail, less, more, grep, awk, cut, lastlog, getent, groups) \
| eval args=mvappend(a1, a2, a3, a4) \
| eval sensitive=mvfilter(match(args, "^/etc/(passwd|group|shadow|sudoers)$")) \
| eval signal=case(isnotnull(sensitive), a0.":".mvindex(sensitive, 0), in(a0, "lastlog", "getent", "groups"), a0) \
| where isnotnull(signal) \
| eval event_time=_time \
| bin _time span=5m \
| stats dc(signal) AS distinct_signals, values(signal) AS signals, min(event_time) AS first_seen BY _time, host \
| where distinct_signals >= 3 \
| convert ctime(first_seen)
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
