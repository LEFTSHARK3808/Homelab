# /opt/splunkforwarder/etc/system/local/inputs.conf  (atomic-lab)
# The forwarder runs as splunkfwd and reads these through the adm group.

[default]
host = atomic-lab

[monitor:///var/log/audit/audit.log]
sourcetype = auditd
index = atomic
disabled = false

[monitor:///var/log/auth.log]
sourcetype = linux_secure
index = atomic
disabled = false

[monitor:///var/log/syslog]
sourcetype = syslog
index = atomic
disabled = false
